<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Une petite question très importante…">
    <meta name="theme-color" content="#ff4d6d">
    <title>Ma Valentine 💖</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💖</text></svg>">

    <link rel="stylesheet" href="style.css">
    <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "wg0hf325wn");

</head>

<body>

    <div class="hearts" aria-hidden="true"></div>

    <main class="card">
        <section class="question" id="question">
            <div class="emoji" aria-hidden="true">💌</div>
            <h1>Veux-tu être ma Valentine ?</h1>
            <p class="subtitle" id="subtitle">Réfléchis bien… 💕</p>

            <div class="buttons">
                <button type="button" class="yes" id="yes">Oui 💖</button>
                <button type="button" class="no" id="no">Non 💔</button>
            </div>
        </section>

        <section class="celebration" id="celebration" hidden>
            <div class="emoji big" aria-hidden="true">🥰</div>
            <h1>Youpiii !</h1>
            <p class="subtitle">Je savais que tu dirais oui 💖<br>Tu rends ma vie plus belle.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
